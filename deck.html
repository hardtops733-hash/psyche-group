<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PSYCHE Group — Investor Deck · 2026</title>
<meta name="description" content="PSYCHE Group investor presentation: ten category-creation companies, one engine, one mission."/>
<style>
:root{
  --bg:#05060f; --bg2:#0a0d1e; --card:rgba(255,255,255,.04); --border:rgba(255,255,255,.09);
  --text:#eef0fa; --muted:#8e97b8; --teal:#5eead4; --violet:#a78bfa; --rose:#fb7185; --amber:#fbbf24; --sky:#7dd3fc;
  --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Consolas,monospace;
  --font:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
canvas#stars{position:fixed;inset:0;z-index:0;}
.grad{background:linear-gradient(94deg,var(--teal),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;}
.mut{color:var(--muted);}
a{color:inherit;text-decoration:none;}

#progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--violet));z-index:300;width:6%;transition:width .18s ease-out;}
#chrome{position:fixed;top:22px;left:0;right:0;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:0 34px;pointer-events:none;}
#chrome .mark{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3em;font-size:13px;pointer-events:auto;transition:.25s;}
#chrome .mark:hover{opacity:.75;}
.chrome-right{display:flex;align-items:center;gap:12px;}
#chrome .conf{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;}
#chrome .back{pointer-events:auto;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--teal);text-transform:uppercase;border:1px solid rgba(94,234,212,.4);padding:9px 16px;border-radius:99px;transition:.25s;white-space:nowrap;}
#chrome .back:hover{background:rgba(94,234,212,.1);}
.chbtn{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;}
.chbtn:hover,.chbtn.on{border-color:var(--teal);color:var(--teal);}
@media(max-width:760px){#chrome .conf{display:none;}}

#counter{position:fixed;bottom:26px;left:34px;z-index:200;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--muted);}
#counter b{color:var(--text);}
#chap{position:fixed;bottom:44px;left:34px;z-index:200;font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--teal);text-transform:uppercase;opacity:.85;}
#hint{position:fixed;bottom:29px;left:50%;transform:translateX(-50%);z-index:200;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;opacity:.65;}
@media(max-width:860px){#hint{display:none;}}
#arrows{position:fixed;bottom:20px;right:30px;z-index:200;display:flex;gap:10px;}
.arr{width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:17px;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;position:relative;}
.arr:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-2px);}

/* ============ scroll-snap engine ============ */
#deck{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none;}
#deck::-webkit-scrollbar{display:none;}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:96px 7vw 120px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;box-sizing:border-box;}
.slide::-webkit-scrollbar{display:none;}
@media (prefers-reduced-motion: reduce){#deck{scroll-behavior:auto;} .slide .a{transition:none;} }

/* staggered entrances */
.slide .a{opacity:0;transform:translateY(20px);transition:opacity .55s cubic-bezier(.22,.61,.36,1),transform .55s cubic-bezier(.22,.61,.36,1);}
.slide.active .a{opacity:1;transform:none;transition-delay:calc(var(--d,0)*.085s + .12s);}

.inner{width:100%;max-width:1100px;position:relative;z-index:2;margin:auto;}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ac,var(--teal));display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.tag::before{content:"";width:30px;height:1px;background:var(--ac,var(--teal));}
h1.big{font-size:clamp(36px,5.4vw,62px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-bottom:20px;}
.lead{font-size:clamp(15.5px,1.8vw,18.5px);color:var(--muted);max-width:720px;}
.center{text-align:center;}
.center .tag{justify-content:center;}
.center .tag::before{display:none;}
.center .lead{margin:0 auto;}

/* cover */
.psi-hero{width:clamp(88px,11vw,120px);margin:0 auto 26px;}
.psi-hero path{stroke-dasharray:160;stroke-dashoffset:160;animation:draw 2.2s .3s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.cover-kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.34em;color:var(--teal);text-transform:uppercase;margin-bottom:24px;}
.cover h1{font-size:clamp(54px,9.4vw,112px);font-weight:800;letter-spacing:.22em;margin:0 0 12px;text-indent:.22em;}
.cover .sub{font-size:clamp(15px,2vw,20px);color:var(--muted);letter-spacing:.05em;}
.cover .meta{margin-top:40px;font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;display:flex;gap:24px;justify-content:center;flex-wrap:wrap;}
.cover .meta b{color:var(--amber);font-weight:700;}
.begin-hint{margin-top:46px;font-family:var(--mono);font-size:10.5px;letter-spacing:.32em;color:var(--teal);text-transform:uppercase;animation:pulseBegin 2s ease-in-out infinite;}
@keyframes pulseBegin{0%,100%{opacity:.35;}50%{opacity:1;}}

/* hook slide */
.hooklines{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.hookline{display:flex;gap:22px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--border);}
.hookline:first-child{border-top:1px solid var(--border);}
.hookline .hn{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--rose);flex:none;}
.hookline .ht{font-size:clamp(19px,2.9vw,29px);font-weight:700;letter-spacing:-.015em;line-height:1.3;}
.hook-close{margin-top:34px;font-size:clamp(16px,2.2vw,21px);color:var(--teal);font-weight:600;}

/* fracture cards */
.fractures{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px;}
.frac{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:24px;transition:.3s;}
.frac:hover{transform:translateY(-4px);border-color:rgba(251,113,133,.4);}
.frac .fv{font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.02em;color:var(--rose);font-variant-numeric:tabular-nums;}
.frac .fk{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:6px;line-height:1.6;}
@media(max-width:820px){.fractures{grid-template-columns:1fr 1fr;}}
@media(max-width:560px){.fractures{grid-template-columns:1fr;}}

/* ten grid */
.ten{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:32px;}
.tchip{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:18px 14px;text-align:center;transition:.3s;}
.tchip:hover{transform:translateY(-4px);border-color:rgba(94,234,212,.45);}
.tchip b{display:block;font-size:14.5px;letter-spacing:.02em;}
.tchip span{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--tc,#5eead4);text-transform:uppercase;display:block;margin-top:5px;}
@media(max-width:820px){.ten{grid-template-columns:repeat(3,1fr);}}
@media(max-width:520px){.ten{grid-template-columns:repeat(2,1fr);}}

/* pairs/trios */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px;}
.pair.three{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){.pair,.pair.three{grid-template-columns:1fr;}}
.pv{border:1px solid var(--border);background:var(--card);border-radius:18px;padding:26px;}
.pv .pv-pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--pc,#5eead4);border:1px solid;border-color:var(--pc,#5eead4);border-opacity:.45;border-radius:99px;padding:4px 11px;display:inline-block;}
.pv h3{font-size:21px;font-weight:800;margin:14px 0 6px;}
.pv .pv-why{font-size:13.5px;font-style:italic;color:#c3cbe4;border-left:2px solid var(--pc,#5eead4);padding-left:13px;margin:12px 0;}
.pv .pv-row{font-size:13px;color:var(--muted);margin-top:9px;}
.pv .pv-row b{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text);display:block;margin-bottom:2px;}

/* moat */
.moat{display:flex;flex-direction:column;gap:12px;margin-top:28px;max-width:780px;}
.mi{display:flex;gap:16px;align-items:center;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:15px 20px;font-size:14.5px;}
.mi .n{font-family:var(--mono);color:var(--teal);font-size:11px;letter-spacing:.18em;flex:none;}
.mi b{color:var(--text);}

/* why-now curves */
.curves{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px;}
@media(max-width:820px){.curves{grid-template-columns:1fr;}}
.cv{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:24px;}
.cv .ci{font-size:24px;margin-bottom:10px;}
.cv b{display:block;font-size:16px;margin-bottom:6px;}
.cv p{font-size:13px;color:var(--muted);}
.cv .cv-n{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--teal);text-transform:uppercase;margin-top:12px;display:block;}

/* market bars */
.bars{display:flex;flex-direction:column;gap:12px;margin-top:28px;max-width:840px;}
.bar-row{display:grid;grid-template-columns:170px 1fr 140px;gap:14px;align-items:center;font-size:13px;}
.bar-row .bl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;text-align:right;}
.bar-row .track{height:12px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;}
.bar-row .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--violet));width:0;transition:width 1.1s cubic-bezier(.22,.61,.36,1) .3s;}
.bar-row .bv{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;}
.bars-note{margin-top:16px;font-size:13px;color:var(--muted);font-style:italic;max-width:840px;}
@media(max-width:640px){.bar-row{grid-template-columns:1fr;gap:5px;} .bar-row .bl{text-align:left;} }

/* roadmap */
.mroad{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px;}
@media(max-width:820px){.mroad{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.mroad{grid-template-columns:1fr;}}
.mph{border:1px solid var(--border);border-top:2px solid var(--teal);border-radius:0 0 14px 14px;background:var(--card);padding:18px;}
.mph .y{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--teal);}
.mph b{display:block;font-size:15.5px;margin:8px 0 5px;}
.mph span{font-size:12.5px;color:var(--muted);line-height:1.55;display:block;}

/* ask + close */
.asks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px;}
@media(max-width:820px){.asks{grid-template-columns:1fr;}}
.ask{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:24px;}
.ask .ai{font-size:22px;margin-bottom:12px;}
.ask b{display:block;font-size:16px;margin-bottom:6px;}
.ask p{font-size:13.5px;color:var(--muted);}
.close-quote{font-size:clamp(19px,2.9vw,29px);font-weight:600;line-height:1.5;max-width:760px;margin:22px auto;background:linear-gradient(120deg,#fff,#c8d0ee);-webkit-background-clip:text;background-clip:text;color:transparent;}
.mission-counter{margin-top:30px;font-family:var(--mono);font-size:clamp(12px,1.8vw,15px);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
.mission-counter b{color:var(--amber);font-size:clamp(20px,3vw,28px);letter-spacing:0;}


/* overview grid */
#ovr{position:fixed;inset:0;z-index:280;background:rgba(3,4,10,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:5vh 5vw;}
#ovr.show{display:flex;animation:ovrFade .35s;}
@keyframes ovrFade{from{opacity:0;}to{opacity:1;}}
.ovr-wrap{width:100%;max-width:1020px;}
.ovr-title{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--teal);text-transform:uppercase;margin-bottom:20px;text-align:center;}
.ovr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-height:74vh;overflow-y:auto;}
@media(max-width:760px){.ovr-grid{grid-template-columns:repeat(2,1fr);}}
.ovr-card{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:16px;cursor:pointer;transition:.25s;text-align:left;color:var(--text);font-family:inherit;}
.ovr-card:hover{transform:translateY(-3px);border-color:var(--teal);background:rgba(94,234,212,.06);}
.ovr-card .on{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2em;}
.ovr-card .ot{font-size:13.5px;font-weight:700;margin-top:6px;line-height:1.3;}
.ovr-card.cur{border-color:var(--teal);box-shadow:0 0 0 2px rgba(94,234,212,.2);}
</style>
</head>

<script>
(function(){
"use strict";
var PSI = '<svg class="psi-hero" viewBox="0 0 32 44" fill="none"><path d="M16 4v36M4 11c0 15 5.5 19.5 12 19.5S28 26 28 11" stroke-width="2.4" stroke-linecap="round" style="stroke:url(#pl)"/></svg>';

var SLIDES = [
{ttl:'Cover', chap:'Investor Presentation 2026', ac:'#5eead4',
 html:'<div class="inner center cover">'+PSI+
  '<div class="cover-kicker a" style="--d:1">Confidential · Investor Presentation · 2026</div>'+
  '<h1 class="a" style="--d:2">PSYCHE</h1>'+

  '<div class="meta a" style="--d:4"><span>EST. 2026 · LAGOS → THE WORLD</span><span>TARGET: <b>10 INDUSTRIES THAT DON\u2019T EXIST YET</b></span></div>'+
  '<div class="begin-hint a" style="--d:6">Scroll to begin ↓</div></div>'},

{ttl:'The Hook', chap:'The Hook', ac:'#fb7185',
 html:'<div class="inner">'+
  '<div class="tag a" style="--d:0;--ac:#fb7185;">The Hook · 2026</div>'+
  '<h1 class="big a" style="--d:1">Three sentences that<br/><span class="grad">shouldn\u2019t be true.</span></h1>'+
  '<div class="hooklines">'+
  '<div class="hookline a" style="--d:2"><span class="hn">/01</span><span class="ht">An AI agent can negotiate a contract — but it cannot open a bank account.</span></div>'+

{ttl:'The Problem', chap:'01 · The Problem', ac:'#fb7185',
 html:'<div class="inner">'+
  '<div class="tag a" style="--d:0;--ac:#fb7185;">01 · The Problem</div>'+
  '<h1 class="big a" style="--d:1">Civilization\u2019s software is updating.<br/><span class="grad">Its institutions aren\u2019t.</span></h1>'+
  '<p class="lead a" style="--d:2">Six fractures. One pattern: the systems humans depend on were built for a world that no longer exists — and nobody owns the replacement layer.</p>'+

  '<div class="frac a" style="--d:3"><div class="fv"><span class="cnt" data-target="400" data-suffix="M+">0</span></div><div class="fk">informal businesses run whole economies with zero software or credit</div></div>'+

  '<div class="frac a" style="--d:7"><div class="fv"><span class="cnt" data-target="68" data-prefix="$" data-suffix="T">0</span></div><div class="fk">changing hands between generations with zero digital-inheritance rails</div></div>'+
  '<div class="frac a" style="--d:8"><div class="fv">Billions</div><div class="fk">of AI agents about to transact — with no identity, budget or labor law</div></div>'+
  '</div></div>'},

{ttl:'The Insight', chap:'02 · The Insight', ac:'#a78bfa',
 html:'<div class="inner center">'+
  '<div class="tag a" style="--d:0;--ac:#a78bfa;">02 · The Insight</div>'+
  '<h1 class="big a" style="--d:1">Every fracture is<br/><span class="grad">an un-owned industry.</span></h1>'+
  '<p class="lead a" style="--d:2">Category-defining companies capture the overwhelming majority of their market\u2019s economics. The biggest winners don\u2019t fight for markets — <b style="color:var(--text);">they name them</b>. Amazon named e-commerce. Stripe named internet payments. Visa named card networks.</p>'+
  '<p class="lead a" style="--d:3" style="margin-top:18px;color:var(--teal);font-weight:600;">PSYCHE\u2019s strategy: never enter a market that already has a name.</p></div>'},

{ttl:'The Company', chap:'03 · The Company', ac:'#5eead4',
 html:'<div class="inner">'+
  '<div class="tag a" style="--d:0">03 · The Company</div>'+
  '<h1 class="big a" style="--d:1">One company. Ten bets.<br/><span class="grad">One engine.</span></h1>'+
  '<p class="lead a" style="--d:2">Alphabet shared data. Amazon shared logistics. PSYCHE shares <b style="color:var(--text);">PSYCHE Core</b> — ten civilization pillars every venture contributes to and draws from. Each new company is cheaper to build and harder to kill than the last.</p>'+
  '<div class="moat">'+
  '<div class="mi a" style="--d:3"><span class="n">/01</span>Not a fund. Not a studio. <b>A single integrated company</b> — shared brand, shared trust, shared rails.</div>'+
  '<div class="mi a" style="--d:4"><span class="n">/02</span>Sequenced to self-fund: <b>revenue-heavy ventures first</b>, civilization-scale moonshots last.</div>'+
  '<div class="mi a" style="--d:5"><span class="n">/03</span>Every venture inherits <b>trust, labor, money, skill and foresight</b> from its siblings on day one.</div>'+
  '</div></div>'},

{ttl:'The Ten', chap:'04 · The Portfolio', ac:'#5eead4',

/* ============ Scroll-snap engine ============ */
var deck=document.getElementById('deck'), idx=0, N=SLIDES.length;
SLIDES.forEach(function(s,i){
  var d=document.createElement('section');
  d.className='slide'; d.innerHTML=s.html; d.dataset.i=i;
  deck.appendChild(d);
});
var slides=deck.children;
function vh(){ return deck.clientHeight || 1; }

/* overview grid */
var ovrGrid=document.getElementById('ovrGrid');
SLIDES.forEach(function(s,i){
  var c=document.createElement('button');
  c.className='ovr-card'; c.dataset.i=i;
  c.innerHTML='<div class="on">'+String(i+1).padStart(2,'0')+'</div><div class="ot">'+s.ttl+'</div>';
  c.addEventListener('click', function(){ toggleOvr(false); goTo(i); });
  ovrGrid.appendChild(c);
});

/* counters */
function runCounters(slide){
  Array.prototype.forEach.call(slide.querySelectorAll('.cnt'), function(el){
    var target=parseFloat(el.dataset.target), pre=el.dataset.prefix||'', suf=el.dataset.suffix||'', comma=el.dataset.comma==='1';
    var start=null;
    function step(ts){
      if(!start)start=ts;
      var p=Math.min((ts-start)/1300,1), e=1-Math.pow(1-p,3), v=Math.round(target*e);
      el.textContent=pre+(comma?v.toLocaleString():v)+suf;
      if(p<1)requestAnimationFrame(step); else el.textContent=pre+(comma?target.toLocaleString():target)+suf;
    }
    requestAnimationFrame(step);
  });
}
function fillBars(slide){
  Array.prototype.forEach.call(slide.querySelectorAll('.fill'), function(f){
    f.style.width='0'; void f.offsetWidth; f.style.width=f.dataset.w+'%';
  });
}

/* autoplay */
var autoOn=false, autoT=null, ringT=null, AUTO_MS=9000;
var ring=document.getElementById('ringProg'), RC=132;
function setRing(f){ ring.style.strokeDashoffset = RC*(1-f); }
function stopRing(){ cancelAnimationFrame(ringT); setRing(0); }
function startRing(){
  stopRing(); var t0=performance.now();
  function loop(t){ var f=(t-t0)/AUTO_MS; if(f>=1){ setRing(0); return; } setRing(f); ringT=requestAnimationFrame(loop); }
  ringT=requestAnimationFrame(loop);
}
function autoStart(){ clearTimeout(autoT); if(!autoOn) return; startRing();
  autoT=setTimeout(function(){ if(idx<N-1){ goTo(idx+1); } else { toggleAuto(false); } }, AUTO_MS); }
function toggleAuto(force){
  autoOn = typeof force==='boolean' ? force : !autoOn;
  document.getElementById('btnAuto').classList.toggle('on', autoOn);
  clearTimeout(autoT); if(autoOn) autoStart(); else stopRing();
}

/* overview */
var ovrOn=false;
function toggleOvr(force){
  ovrOn = typeof force==='boolean' ? force : !ovrOn;
  document.getElementById('ovr').classList.toggle('show', ovrOn);
  deck.style.overflowY = ovrOn ? 'hidden' : 'auto';
  if(ovrOn){ Array.prototype.forEach.call(ovrGrid.children, function(c,j){ c.classList.toggle('cur', j===idx); }); }
}

/* index-change sync */
function syncToIndex(i){
  idx=i;
  Array.prototype.forEach.call(slides, function(s,j){ s.classList.toggle('active', j===i); });
  document.getElementById('counter').innerHTML='<b>'+String(i+1).padStart(2,'0')+'</b> / '+N;
  document.getElementById('chap').textContent=SLIDES[i].chap||'';
  fillBars(slides[i]);
  if(autoOn) autoStart();
  try{ history.replaceState(null,'','#'+(i+1)); }catch(e){}
}
var ticking=false;
deck.addEventListener('scroll', function(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(function(){
    ticking=false;
    var total=deck.scrollHeight-vh();
    var pct=total>0 ? deck.scrollTop/total*100 : 0;
    document.getElementById('progress').style.width=Math.min(100,Math.max(6,pct))+'%';
    var i=Math.round(deck.scrollTop/vh());
    i=Math.max(0,Math.min(N-1,i));
    if(i!==idx) syncToIndex(i);
  });
}, {passive:true});

function goTo(i, instant){
  i=Math.max(0,Math.min(N-1,i));
  var behavior = instant ? 'auto' : 'smooth';
  if(instant){ deck.style.scrollBehavior='auto'; deck.scrollTop=i*vh(); deck.style.scrollBehavior=''; if(i!==idx) syncToIndex(i); return; }
  deck.scrollTo({top:i*vh(), behavior:behavior});
  /* if already exactly there, sync anyway */
  if(deck.scrollTop===i*vh() && i!==idx) syncToIndex(i);
}
function next(){ goTo(idx+1); }
function back(){ goTo(idx-1); }

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', back);
document.getElementById('btnAuto').addEventListener('click', function(){ toggleAuto(); });
document.getElementById('btnFull').addEventListener('click', function(){
  try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(e){}
});
document.addEventListener('keydown', function(e){
  var k=e.key.toLowerCase();
  if(k==='o'||k==='escape'){ e.preventDefault(); toggleOvr(); return; }
  if(ovrOn) return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); back(); }
  else if(e.key==='Home'){ e.preventDefault(); goTo(0); }
  else if(e.key==='End'){ e.preventDefault(); goTo(N-1); }
  else if(k==='a'){ toggleAuto(); }
  else if(k==='q'){ location.href='index.html'; }
  else if(k==='f'){ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(err){} }
});
window.addEventListener('resize', function(){ deck.style.scrollBehavior='auto'; deck.scrollTop=idx*vh(); deck.style.scrollBehavior=''; });

/* boot */
syncToIndex(0);
var start=parseInt((location.hash||'').slice(1),10);
if(!isNaN(start) && start>1){ goTo(Math.min(N,start)-1, true); }

/* ============ Starfield ============ */
var cv=document.getElementById('stars'), ctx=cv.getContext('2d'), W,H,pts=[];
var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
function init(){ pts=[]; var n=Math.min(120, Math.floor(W*H/14000)); for(var i=0;i<n;i++) pts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.4,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,hue:Math.random()<.5?'94,234,212':'167,139,250'}); }
addEventListener('resize', function(){ size(); init(); });
function frame(){
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<pts.length;i++){
    var p=pts[i];
    if(!reduced){ p.x+=p.vx; p.y+=p.vy; }
    if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fillStyle='rgba('+p.hue+',.45)'; ctx.fill();
  }
  for(var a=0;a<pts.length;a++)for(var b=a+1;b<pts.length;b++){
    var dx=pts[a].x-pts[b].x, dy=pts[a].y-pts[b].y, d=dx*dx+dy*dy;
    if(d<9500){ ctx.beginPath(); ctx.moveTo(pts[a].x,pts[a].y); ctx.lineTo(pts[b].x,pts[b].y); ctx.strokeStyle='rgba(140,160,220,'+(0.08*(1-d/9500))+')'; ctx.lineWidth=.6; ctx.stroke(); }
  }
  requestAnimationFrame(frame);
}
size(); init(); frame();
})();
</script>
